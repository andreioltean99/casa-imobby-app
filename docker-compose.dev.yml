services:
  app:
    build:
      context: .
    container_name: casa-imobby-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    expose:
      - "9000"
    ports:
      - "5173:5173"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: casa_imobby
      DB_USERNAME: casa_imobby
      DB_PASSWORD: casa_imobby
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      bash -lc "
        set -e
        cd /var/www/html
        composer install --no-interaction --prefer-dist
        test -f vendor/autoload.php
        if [ ! -f .env ]; then cp .env.example .env; fi
        php artisan optimize:clear || true
        php artisan key:generate --force
        ([ -e public/storage ] || php artisan storage:link)
        sleep 10
        php artisan migrate --force || true
        echo '==> Installing frontend deps...'
        (npm ci --include=dev || npm install --include=dev)
        node -e \"require.resolve('vite/package.json')\"
        test -f node_modules/.bin/vite
        test -f node_modules/.bin/concurrently
        (php-fpm &) &&
        exec ./node_modules/.bin/concurrently -c \"#93c5fd,#fb7185,#86efac\" \"cd /var/www/html && exec php artisan queue:listen --tries=1 --timeout=0\" \"cd /var/www/html && exec ./node_modules/.bin/vite --host 0.0.0.0 --port 5173\" --names=queue,vite --kill-others
      "

  nginx:
    image: nginx:1.27-alpine
    container_name: casa-imobby-nginx
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    image: mysql:8.4
    container_name: casa-imobby-mysql
    restart: unless-stopped
    command: ["mysqld", "--pid-file=/var/lib/mysql/mysqld.pid"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: casa_imobby
      MYSQL_USER: casa_imobby
      MYSQL_PASSWORD: casa_imobby
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
